<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Form</title>
    <link rel="stylesheet" href="frontend/style/login_style.css">
    <!-- FontAwesome for eye icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="login-container">
        <h2>Welcome Back</h2>
        <p class="subtitle">Please enter your details to sign in</p>
        
        <form id="loginForm" novalidate>
            <!-- Email Field -->
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="e.g., name@example.com" required>
                <span class="error-message" id="emailError">Please enter a valid email.</span>
            </div>

            <!-- Password Field -->
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fas fa-eye-slash toggle-password" id="togglePassword"></i>
                </div>
                <span class="error-message" id="passwordError">Password must be at least 6 characters.</span>
            </div>
            
            <!-- Remember Me & Forgot Password -->
            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox" id="remember"> Remember me
                </label>
                
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Sign Up</button>
        </form>
    </div>

    <script src="frontend/javascript/login_script.js"></script>
</body>
</html>
